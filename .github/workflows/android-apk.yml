name: Construir APK do Game Ads

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Gerar instalador (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar o Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar o Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="sdkmanager"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true

      - name: Construir o APK
        run: gradle assembleDebug --no-daemon

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: GameAds-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
